<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeMentor AI - Algorithm Tutor</title>


    <!-- ================= BASE CSS ================= -->

    <link
        rel="stylesheet"
        href="css/base/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/base/theme.css"
    >


    <!-- ================= COMPONENT CSS ================= -->

    <link
        rel="stylesheet"
        href="css/components/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/components/buttons.css"
    >

    <link
        rel="stylesheet"
        href="css/components/chat.css"
    >

    <link
        rel="stylesheet"
        href="css/components/sidebar.css"
    >


    <!-- ================= WORKSPACE CSS ================= -->

    <link
        rel="stylesheet"
        href="css/pages/workspace.css"
    >


    <!-- ================= HIGHLIGHT.JS ================= -->

    <link
        id="hl-light"
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
    >

    <link
        id="hl-dark"
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
        disabled
    >


    <!-- ================= GOOGLE FONT ================= -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ================= MATHJAX ================= -->

    <script>

        window.MathJax = {

            tex: {

                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ],

                displayMath: [
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ]

            },

            svg: {

                fontCache: 'global'

            }

        };

    </script>


    <script
        id="MathJax-script"
        async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    ></script>


    <!-- ================= THEME ================= -->

    <script>

        if (
            localStorage.getItem("theme") === "dark"
        ) {

            document.documentElement.classList.add("dark");

        }

    </script>


    <!-- ================= MONACO ================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"
    ></script>

</head>


<body data-tool="algorithm">


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <nav class="navbar">


        <div class="logo">

            CodeMentor AI

        </div>


        <div class="nav-links">


            <button
                id="toggleSidebar"
                class="theme-btn"
            >
                ☰
            </button>


            <a
                href="dashboard.html"
                class="active"
            >
                Dashboard
            </a>


            <button
                id="themeToggle"
                class="theme-btn"
            >
                🌙
            </button>


        </div>


        <div class="user-menu">

            <span id="username">
                User
            </span>

        </div>


    </nav>



    <!-- ================================================= -->
    <!-- MAIN WORKSPACE -->
    <!-- ================================================= -->

    <main class="workspace">


        <!-- ================================================= -->
        <!-- SIDEBAR -->
        <!-- ================================================= -->

        <aside class="sidebar">


            <!-- NEW CHAT -->

            <button
                id="newChatBtn"
                class="new-chat-btn"
            >
                + New Chat
            </button>


            <!-- RECENT CHATS -->

            <div class="sidebar-title">

                Recent Chats

            </div>


            <div
                id="historyList"
                class="history-list"
            ></div>


        </aside>



        <!-- ================================================= -->
        <!-- CHAT SECTION -->
        <!-- ================================================= -->

        <section class="chat-section">


            <!-- ================= CHAT ================= -->

            <div class="chat-layout">


                <!-- WELCOME -->

                <div
                    id="welcomeScreen"
                    class="welcome"
                >

                    <h1>
                        📚 Algorithm Tutor
                    </h1>


                    <p>

                        Learn any Data Structure or
                        Algorithm with detailed explanations,
                        visual intuition, complexity analysis,
                        examples and interview tips.

                    </p>


                </div>


                <!-- CHAT CONTAINER -->

                <div
                    id="chatContainer"
                ></div>


            </div>



            <!-- ================================================= -->
            <!-- INPUT BAR -->
            <!-- ================================================= -->

            <footer class="input-bar">


                <div class="input-wrapper">


                    <!-- MONACO EDITOR -->

                    <div
                        id="problemInput"
                        class="editor-container"
                    ></div>



                    <!-- INPUT FOOTER -->

                    <div class="input-footer">


                        <!-- LANGUAGE -->

                        <select id="language">

                            <option value="cpp">
                                C++
                            </option>

                            <option value="c">
                                C
                            </option>

                            <option value="java">
                                Java
                            </option>

                            <option value="python">
                                Python
                            </option>

                        </select>



                        <!-- SEND -->

                        <button
                            id="solveBtn"
                        >

                            ➜

                        </button>


                    </div>


                </div>


            </footer>


        </section>


    </main>



    <!-- ================================================= -->
    <!-- HIGHLIGHT.JS -->
    <!-- ================================================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
    ></script>



    <!-- ================================================= -->
    <!-- PAGE SCRIPTS -->
    <!-- ================================================= -->


    <!-- Algorithm Tutor -->

    <script
        type="module"
        src="js/pages/algorithm.js"
    ></script>


    <!-- Sidebar History -->

    <script
        type="module"
        src="js/pages/history.js"
    ></script>


    <!-- Sidebar Component -->

    <script
        type="module"
        src="js/components/sidebar.js"
    ></script>


    <!-- Theme -->

    <script
        type="module"
        src="js/utils/theme.js"
    ></script>


    <!-- Authentication -->

    <script
        type="module"
        src="js/auth.js"
    ></script>


    <!-- User -->

    <script
        type="module"
        src="js/user.js"
    ></script>


</body>

</html>
